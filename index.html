<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Christopher W Moriarty</title>
  <style>
    :root {
      --bg-light: #f7f4ee;
      --surface-light: #fdfbf7;
      --border-light: rgba(31, 27, 22, 0.11);
      --text-light: #1f1b16;
      --secondary-light: #544c42;
      --muted-light: #6b6358;
      --accent-light: #146c5c;

      --bg-dark: #141415;
      --surface-dark: #19191b;
      --border-dark: rgba(237, 237, 237, 0.1);
      --text-dark: #ededed;
      --secondary-dark: #a8a8ad;
      --muted-dark: #8c8c93;
      --accent-dark: #4cc38a;

      --bg: var(--bg-light);
      --surface: var(--surface-light);
      --border: var(--border-light);
      --text: var(--text-light);
      --secondary: var(--secondary-light);
      --muted: var(--muted-light);
      --accent: var(--accent-light);

      color-scheme: light dark;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: var(--bg-dark);
        --surface: var(--surface-dark);
        --border: var(--border-dark);
        --text: var(--text-dark);
        --secondary: var(--secondary-dark);
        --muted: var(--muted-dark);
        --accent: var(--accent-dark);
      }
    }

    @supports (color: light-dark(white, black)) {
      :root {
        --bg: light-dark(var(--bg-light), var(--bg-dark));
        --surface: light-dark(var(--surface-light), var(--surface-dark));
        --border: light-dark(var(--border-light), var(--border-dark));
        --text: light-dark(var(--text-light), var(--text-dark));
        --secondary: light-dark(var(--secondary-light), var(--secondary-dark));
        --muted: light-dark(var(--muted-light), var(--muted-dark));
        --accent: light-dark(var(--accent-light), var(--accent-dark));
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-block-size: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 24px;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    main {
      inline-size: min(440px, 100%);
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(1.5rem, 1.2rem + 1vw, 2rem);
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .link-group {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .group-label {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      inline-size: 100%;
      min-block-size: 36px;
      padding: 6px 0;
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      transition: color 140ms cubic-bezier(0.22, 1, 0.36, 1), border-color 140ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    a:hover {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .meta {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.8125rem;
      color: var(--muted);
    }

    footer {
      margin-top: 32px;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.8125rem;
      color: var(--secondary);
    }
  </style>
</head>
<body>
  <main>
    <h1>Christopher W Moriarty</h1>
      <div>
        <ul class="link-group" role="list">
          <li><a href="Chris%20Moriarty%20-%20Resume.pdf"><span>resume</span></a></li>
          <li><a href="https://github.com/cwmoriarty" rel="noopener noreferrer"><span>gitb</span></a></li>
          <li><a href="https://www.linkedin.com/in/cwmoriarty/" rel="noopener noreferrer"><span>linkedin</span></a></li>
        </ul>
      </div>
      <div>
        <ul class="link-group" role="list">
          <li><a href="/optout-guide"><span>optout-guide</span></a></li>
          <li><a href="https://sunblock.app" rel="noopener noreferrer"><span>sunblock.app</span></a></li>
          <li><a href="https://speak-n-spell.app" rel="noopener noreferrer"><span>speak-n-spell.app</span></a></li>
        </ul>
      </div>
    </nav>
    <footer>
      <code>cwm - at - cwmoriarty.com</code>
    </footer>
  </main>
</body>
</html>
