phase5:
  id: "phase-5-outsmart-ad-tech-search--device-tracking"
  num: "05"
  short: "Ad tech & tracking"
  title: "Outsmart ad tech, search & device tracking"
  intro: "Removing your name from brokers does not stop apps, browsers, TVs, cars, and cell carriers from harvesting fresh behavioral profiles every day."
  items:
    - id: "p5-google-results"
      title: "Google Results about you"
      url: "https://myactivity.google.com/results-about-you"
      note: "Set up alerts and submit one-click removal requests whenever Google Search indexes your home address, phone number, or personal email. Even before a broker deletes your listing, this hides it from casual searchers."
    - id: "p5-gpc"
      title: "Global Privacy Control (GPC)"
      url: "https://globalprivacycontrol.org/"
      note: "Enable GPC in your browser (built into Firefox, Brave, and DuckDuckGo, or via extension). It sends an automatic Sec-GPC: 1 signal telling websites not to sell or share your data, legally enforceable in California and over a dozen other states."
      links:
        - label: "Firefox"
          url: "https://www.firefox.com/"
        - label: "Brave"
          url: "https://brave.com/"
    - id: "p5-webchoices"
      title: "DAA WebChoices"
      url: "https://optout.aboutads.info/"
      note: "Scan your browser and opt out of behavioral tracking across participating ad networks (re-run if you clear cookies; the NAI retired its legacy opt-out tool in favor of GPC and OS controls)."
    - id: "p5-blockers"
      title: "Block trackers at the browser & DNS level"
      note: "Use Firefox with uBlock Origin (and optionally Privacy Badger) or Brave to strip ad scripts and fingerprinting pixels. For system-wide blocking across apps and smart devices, configure encrypted DNS filtering."
      links:
        - label: "uBlock Origin"
          url: "https://ublockorigin.com/"
        - label: "Privacy Badger"
          url: "https://privacybadger.org/"
        - label: "NextDNS"
          url: "https://nextdns.io/"
        - label: "Control D"
          url: "https://controld.com/"
        - label: "AdGuard DNS"
          url: "https://adguard-dns.io/"
    - id: "p5-mobile-ad-id"
      title: "Reset & disable mobile ad IDs"
      note: "On iOS: Settings → Privacy & Security → Tracking (turn off Allow Apps to Request to Track) and Apple Advertising (turn off Personalized Ads). On Android: Settings → Privacy → Ads → Delete advertising ID. Revoke background location access for apps that do not strictly need it."
      links:
        - label: "DuckDuckGo App Tracking Protection (Android)"
          url: "https://duckduckgo.com/duckduckgo-help-pages/p-app-tracking-protection/what-is-app-tracking-protection/"
    - id: "p5-carriers"
      title: "Opt out of mobile carrier tracking (CPNI)"
      note: "Wireless carriers monetize app usage, browsing metadata, and location trends unless you opt out."
      links:
        - label: "AT&T Privacy Choices"
          url: "https://www.att.com/PrivacyChoices"
        - label: "AT&T CPNI Opt-Out"
          url: "https://www.att.com/ecpnioptout"
        - label: "Verizon Privacy Center"
          url: "https://www.verizon.com/about/privacy/"
        - label: "T-Mobile Privacy Center"
          url: "https://www.t-mobile.com/privacy-center"
    - id: "p5-smart-tv"
      title: "Disable smart TV surveillance (ACR)"
      note: "Smart TVs (LG, Samsung, Sony, Vizio, Roku) use Automatic Content Recognition (ACR) to fingerprint what you watch, even over HDMI, and sell viewing habits to ad networks. Disable Viewing Information, ACR, Live Plus, or Interactive TV in privacy settings, or disconnect the TV from Wi-Fi and use a dedicated streaming box."
    - id: "p5-cars"
      title: "Turn off connected car telemetry"
      note: "Modern automakers collect driving telemetry (braking, speed, trip times) through connected apps and sell it to insurance risk brokers like LexisNexis and Verisk. Opt out of driving data sharing in your automaker's app and privacy portal, and request your consumer disclosure reports to check what was collected."
    - id: "p5-breaches"
      title: "Monitor email breaches"
      note: "Register your email addresses with free breach-alert services so you know immediately when credentials or personal records leak."
      links:
        - label: "Have I Been Pwned"
          url: "https://haveibeenpwned.com/"
        - label: "Mozilla Monitor"
          url: "https://monitor.mozilla.org/"

phase6:
  id: "phase-6-preventive-hygiene-stop-feeding-the-pipeline"
  num: "06"
  short: "Preventive hygiene"
  title: "Preventive hygiene: stop feeding the pipeline"
  intro: "Every time you hand over your real email, phone number, or debit card to a merchant, you restart the data broker cycle."
  items:
    - id: "p6-email-aliases"
      title: "Use a unique email alias for every account"
      note: "When an alias starts getting spam, you know which company sold or leaked your data and can turn that alias off instantly. Apple Hide My Email works well alongside dedicated alias tools."
      links:
        - label: "SimpleLogin"
          url: "https://simplelogin.io/"
        - label: "Addy.io"
          url: "https://addy.io/"
        - label: "Firefox Relay"
          url: "https://relay.firefox.com/"
    - id: "p6-phone-mask"
      title: "Never give your real phone number to businesses"
      note: "Keep your primary SIM number strictly for family, close contacts, and banking. Use a VoIP or masked number for store checkouts, deliveries, realtors, doctors' offices, and web forms, and move sensitive accounts from SMS 2FA to app-based TOTP or passkeys."
      links:
        - label: "MySudo"
          url: "https://mysudo.com/"
        - label: "Google Voice"
          url: "https://voice.google.com/"
        - label: "Cloaked"
          url: "https://www.cloaked.com/"
    - id: "p6-virtual-cards"
      title: "Use virtual payment cards"
      note: "Generate merchant-locked cards with spend limits using Privacy.com or your bank's virtual card feature. This shields your real card number from merchant breaches and blocks cross-merchant purchase tracking."
      links:
        - label: "Privacy.com"
          url: "https://www.privacy.com/"
    - id: "p6-loyalty"
      title: "Bypass the retail loyalty card trap"
      note: "Grocery and pharmacy loyalty programs (CVS, Walgreens, Kroger, Safeway) tie in-person purchases directly to identity graphs like LiveRamp. Skip the loyalty card, use a VoIP number, or use a store courtesy number when discounts require a phone lookup."

california:
  id: "california-residents"
  num: "CA"
  short: "California rights"
  title: "California residents"
  intro: "California residents have strong statutory protections under the California Consumer Privacy Act (CCPA) and the California DELETE Act (SB 362)."
  items:
    - id: "ca-drop"
      title: "California DROP (Delete Request and Opt-out Platform)"
      url: "https://privacy.ca.gov/drop/"
      note: "The official portal managed by the California Privacy Protection Agency (CPPA) to submit a single deletion request to all registered data brokers in California."
    - id: "ca-registry"
      title: "California Data Broker Registry"
      url: "https://cppa.ca.gov/data_broker_registry/"
      note: "The CPPA's searchable registry of all registered data brokers, including direct links to their individual opt-out and deletion pages."
    - id: "ca-gpc"
      title: "Global Privacy Control (GPC)"
      url: "https://globalprivacycontrol.org/"
      note: "Legally binding browser signal in California that compels websites not to sell or share your personal data."

other_states:
  id: "other-state-privacy-rights"
  title: "Other state privacy rights"
  body: "Over a dozen states now enforce comprehensive privacy laws giving residents the legal right to delete personal data and opt out of targeted advertising and data sales. States including Colorado, Connecticut, Texas, Oregon, Montana, Delaware, New Jersey, New Hampshire, Nebraska, Maryland, and Minnesota legally require businesses to honor automated Global Privacy Control (GPC) signals just like California. Residents of Virginia, Utah, Iowa, and Indiana also have statutory opt-out and deletion rights through company privacy portals. Look for the Your Privacy Choices link in website footers to exercise state-level deletion rights even outside California."

references:
  - "https://simpleoptout.com/"
  - "https://inteltechniques.com/workbook"
  - "https://www.privacyguides.org/"
  - "https://ssd.eff.org/"
  - "https://github.com/glamrock/data-brokers/blob/master/data-brokers.md"
  - "https://github.com/yaelwrites/Big-Ass-Data-Broker-Opt-Out-List"
