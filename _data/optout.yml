meta:
  title: "Guide to Opting Out"
  subtitle: "A practical checklist to stop physical junk mail and robocalls, freeze credit and consumer files, remove data broker records, and cut off ad-tech tracking."
  scope: "Focused primarily on US laws, credit bureaus, postal mailers, and data brokers. Phases 3, 5, and 6 (paid removal services, ad-tech blocking, aliasing, and virtual cards) apply globally."
  repo_url: "https://github.com/cwmoriarty/cwmoriarty.github.io"
  contact_email: "cwm - at - cwmoriarty.com"

fundamentals:
  - title: "Never use your primary email or phone number to opt out"
    body: "Data brokers log verification inputs. Use a dedicated burner email or email alias, and a secondary VoIP number when phone verification is required."
  - title: "Never volunteer new information"
    body: "Only confirm details a broker already holds, or the minimum needed to match your record. Never upload a government ID unless legally required, and redact everything except your name and address if you do."
  - title: "Freeze your credit before chasing brokers"
    body: "Removing a people-search listing hides your public trail, but a credit freeze stops criminals from opening loans, bank accounts, or utility lines in your name."
  - title: "Understand how data flows"
    body: "Most small people-search sites buy from a handful of upstream aggregators, USPS change-of-address feeds, and retail loyalty programs. Stopping upstream sources gives you the biggest return."
  - title: "Poison the pipeline going forward"
    body: "Deletion is only half the job. Using unique email aliases, masked phone numbers, virtual cards, and network tracker blocking prevents new profiles from forming."
  - title: "Use legal leverage"
    body: "Under federal laws (FCRA, TCPA) and state privacy laws (such as California's CCPA and Delete Act), opting out is a legal right with enforceable deadlines, not a favor you are asking."

phase1:
  id: "phase-1-eliminate-junk-mail--phone-spam"
  num: "01"
  short: "Junk mail & spam"
  title: "Eliminate junk mail & phone spam"
  estimate: "~15 min"
  items:
    - id: "p1-donotcall"
      title: "National Do Not Call Registry"
      url: "https://www.donotcall.gov/"
      note: "Register your mobile and landline numbers to make unsolicited telemarketing calls illegal under federal law."
    - id: "p1-optoutprescreen"
      title: "OptOutPrescreen"
      url: "https://www.optoutprescreen.com/"
      note: "Cuts off pre-approved credit card and insurance mailers from the major credit bureaus (5-year electronic opt-out, or permanent opt-out by mailing the signed confirmation form)."
    - id: "p1-dmachoice"
      title: "DMAchoice"
      meta: "$5 / 10 yr"
      url: "https://www.dmachoice.org/"
      note: "Stops direct marketing mail from companies you have not bought from."
      extra_label: "eMPS Email Opt-Out List"
      extra_url: "https://www.ims-dm.com/cgi/optoutemps.php"
    - id: "p1-valpak"
      title: "Valpak Direct Mail Opt-Out"
      url: "https://www.valpak.com/remove-address"
      note: "Stops delivery of the blue envelope of local advertising coupons."
    - id: "p1-save"
      title: "Save.com (formerly RedPlum / RetailMeNot)"
      url: "https://www.save.com/manage"
      note: "Stops delivery of the weekly grocery and retail coupon mailer."
      extra_label: "Direct OneTrust form"
      extra_url: "https://privacyportal.onetrust.com/webform/45e4be25-919b-483f-9f95-12809576a2b3/6e633594-9a81-48bb-97ab-6fb29bf46019"
    - id: "p1-catalogchoice"
      title: "Catalog Choice"
      url: "https://www.catalogchoice.org/"
      note: "Free service to search and unsubscribe from specific merchant catalogs and mailers."
    - id: "p1-directmail"
      title: "DirectMail.com Do Not Mail List"
      url: "https://www.directmail.com/mail_preference/"
      note: "Free opt-out list used by a broad network of commercial direct mailers."
    - id: "p1-informed"
      title: "USPS Informed Delivery"
      url: "https://www.usps.com/manage/informed-delivery.htm"
      note: "Daily digital previews of incoming mail so you can spot lingering spam senders and catch mail theft without sorting paper."
    - id: "p1-callscreen"
      title: "Enable phone call screening"
      note: "Turn on Silence Unknown Callers (iOS) or Call Screen and Spam Protection (Android), plus your mobile carrier's free spam-blocking filter (AT&T ActiveArmor, Verizon Call Filter, or T-Mobile Scam Shield)."
  callouts:
    - label: "Refusing mail"
      text: "Unopened First-Class and Priority Mail can be marked REFUSED: RETURN TO SENDER and left in your mailbox. Bulk mail marked PRSRT STD (Presorted Standard) or Nonprofit Org does not include return postage and cannot be refused; opt out directly using the links above."
    - label: "Moving trap (NCOA)"
      text: "When you file a USPS Change of Address, USPS licenses your new address through the National Change of Address (NCOA) database to commercial mailers and data brokers. When moving, update banks, employers, and government agencies directly to avoid triggering a fresh wave of broker listings."

phase2:
  id: "phase-2-freeze-your-credit--consumer-reports"
  num: "02"
  short: "Credit freezes"
  title: "Freeze your credit & consumer reports"
  estimate: "~15 min · Free"
  intro: "Freezing your credit and specialty consumer files blocks anyone from opening loans, credit cards, bank accounts, or utility and cell lines in your name, even if your Social Security number leaks in a breach. Freezing is free by federal law, does not affect your credit score or existing accounts, and can be lifted in minutes when you apply for credit."
  items:
    - id: "p2-experian"
      title: "Experian Security Freeze"
      url: "https://www.experian.com/help/credit-freeze/"
    - id: "p2-equifax"
      title: "Equifax Security Freeze"
      url: "https://www.equifax.com/personal/credit-report-services/credit-freeze/"
    - id: "p2-transunion"
      title: "TransUnion Credit Freeze"
      url: "https://www.transunion.com/credit-freeze"
    - id: "p2-innovis"
      title: "Innovis Security Freeze"
      url: "https://www.innovis.com/personal/securityFreeze"
      note: "Fourth national credit bureau."
    - id: "p2-chexsystems"
      title: "ChexSystems Security Freeze"
      url: "https://www.chexsystems.com/security-freeze/place-freeze"
      note: "Blocks fraudulent checking and savings accounts."
    - id: "p2-nctue"
      title: "NCTUE Security Freeze"
      url: "https://nctueconsumerportal.com/"
      note: "Blocks fraudulent telecom, mobile, pay-TV, and utility accounts."
    - id: "p2-lexisnexis"
      title: "LexisNexis Security Freeze"
      url: "https://consumer.risk.lexisnexis.com/freeze"
      note: "Restricts specialty risk, insurance, and identity verification files."
    - id: "p2-annualcreditreport"
      title: "AnnualCreditReport.com"
      url: "https://www.annualcreditreport.com/"
      note: "Free weekly reports from Equifax, Experian, and TransUnion to audit old addresses and spot unfamiliar accounts."
  callout:
    label: "Protect minors"
    text: "If you have children under 18, freeze their credit with Equifax, Experian, and TransUnion. Minors' SSNs are frequent targets for synthetic identity fraud because their credit goes unchecked for years."

